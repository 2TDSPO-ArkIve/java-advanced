spring.datasource.url=${ARKIVE_DB_URL}
spring.datasource.username=${ARKIVE_DB_USERNAME}
spring.datasource.password=${ARKIVE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${ARKIVE_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

# Owner do package Oracle. Nao e credencial e pode ser sobrescrito sem alterar o codigo.
arkive.oracle.indicadores.schema=${ARKIVE_ORACLE_INDICADORES_SCHEMA:RM561996}

arkive.bootstrap.sysadmin.enabled=${ARKIVE_BOOTSTRAP_SYSADMIN_ENABLED:false}
arkive.bootstrap.sysadmin.name=${ARKIVE_BOOTSTRAP_SYSADMIN_NAME:}
arkive.bootstrap.sysadmin.login=${ARKIVE_BOOTSTRAP_SYSADMIN_LOGIN:}
arkive.bootstrap.sysadmin.password=${ARKIVE_BOOTSTRAP_SYSADMIN_PASSWORD:}

# Oracle FIAP - limited connection pool
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000