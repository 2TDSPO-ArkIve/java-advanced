spring.application.name=arkive
spring.profiles.default=oracle
server.port=${PORT:8080}
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
arkive.clinical-engine.base-url=${ARKIVE_CLINICAL_ENGINE_URL:https://arkive-clinical-engine.onrender.com}
arkive.clinical-engine.connect-timeout=10s
arkive.clinical-engine.read-timeout=120s
arkive.azure.speech.endpoint=${AZURE_SPEECH_ENDPOINT:}
arkive.azure.speech.api-key=${AZURE_SPEECH_API_KEY:}
arkive.azure.speech.max-upload-size=10MB
arkive.azure.speech.recognition-timeout=120s
arkive.azure.speech.conversion-timeout=30s
arkive.azure.speech.sdk-operation-timeout=10s
arkive.azure.speech.max-concurrent-requests=1
arkive.patient-sharing.token-ttl=PT24H
arkive.push.expo.enabled=${ARKIVE_EXPO_PUSH_ENABLED:false}
arkive.push.expo.url=${ARKIVE_EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
arkive.push.expo.connect-timeout=${ARKIVE_EXPO_PUSH_CONNECT_TIMEOUT:2s}
arkive.push.expo.read-timeout=${ARKIVE_EXPO_PUSH_READ_TIMEOUT:5s}
arkive.push.expo.access-token=${ARKIVE_EXPO_PUSH_ACCESS_TOKEN:}
arkive.azure.speech.phrase-list-biasing-weight=1.3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
