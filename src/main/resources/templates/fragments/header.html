<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="header(pageTitle)">
	<div>
		<p class="eyebrow" th:text="${roleLabel}">Perfil</p>
		<h1 th:text="${pageTitle}">Visão Geral</h1>
	</div>
	<div class="user-menu">
		<div class="user-copy">
			<span th:text="${displayName}">Usuario</span>
			<small th:text="${roleLabel}">Perfil</small>
		</div>
		<form th:action="@{/logout}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<button class="button button-secondary" type="submit">Sair</button>
		</form>
	</div>
</header>
</body>
</html>
