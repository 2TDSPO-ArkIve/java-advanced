<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<aside class="sidebar" th:fragment="sidebar">
	<a class="brand" th:href="@{/}">
		<img class="brand-logo" th:src="@{/images/definitive.png}" alt="ArkIve">
	</a>

	<nav class="nav" aria-label="Navegacao administrativa">
		<a class="nav-link"
		   th:classappend="${roleLabel == 'SysAdmin' and pageTitle == 'Visão Geral'} ? ' is-active'"
		   th:href="@{/sysadmin/dashboard}"
		   sec:authorize="hasRole('SYSADMIN')">Visão Geral</a>
		<a class="nav-link"
		   th:classappend="${roleLabel == 'SysAdmin' and (pageTitle == 'Usuários' or pageTitle == 'Novo usuário')} ? ' is-active'"
		   th:href="@{/sysadmin/usuarios}"
		   sec:authorize="hasRole('SYSADMIN')">Usuários</a>
		<a class="nav-link"
		   th:classappend="${roleLabel == 'Administrador da Clínica' and pageTitle == 'Visão Geral'} ? ' is-active'"
		   th:href="@{/admin/dashboard}"
		   sec:authorize="hasRole('ADMIN_CLINICA')">Visão Geral</a>
	</nav>
</aside>
</body>
</html>
