<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<div class="page-actions">
				<div>
					<p class="eyebrow">SysAdmin</p>
					<h2>Novo usuário</h2>
					<p>Crie uma conta com senha protegida por BCrypt e vínculo compatível com o perfil.</p>
				</div>
				<a class="button button-secondary" th:href="@{/sysadmin/usuarios}">Voltar</a>
			</div>

			<form class="form form-card" th:action="@{/sysadmin/usuarios}" th:object="${usuario}" method="post" novalidate>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<input type="hidden" name="ativo" value="S">

				<div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erro</div>

				<div class="field">
					<label for="nome">Nome</label>
					<input id="nome" type="text" th:field="*{nome}" autocomplete="name" required>
					<span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</span>
				</div>

				<div class="field">
					<label for="login">Login</label>
					<input id="login" type="email" th:field="*{login}" autocomplete="username" required>
					<span class="field-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}">Erro</span>
				</div>

				<div class="field">
					<label for="senha">Senha</label>
					<input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
					<span class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro</span>
				</div>

				<div class="field">
					<label for="tipo">Perfil</label>
					<select id="tipo" th:field="*{tipo}" required>
						<option value="">Selecione</option>
						<option th:each="tipo : ${tipos}" th:value="${tipo.name()}" th:text="${tipo.name() == 'SYSADMIN' ? 'SysAdmin' : tipo.name() == 'ADMIN_CLINICA' ? 'Administrador da Clínica' : tipo.name() == 'VETERINARIO' ? 'Veterinário' : 'Responsável'}">Perfil</option>
					</select>
					<span class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}">Erro</span>
				</div>

				<div class="field context-field" data-context="ADMIN_CLINICA">
					<label for="clinicaId">Clínica</label>
					<select id="clinicaId" th:field="*{clinicaId}">
						<option value="">Selecione</option>
						<option th:each="clinica : ${clinicas}" th:value="${clinica.id}" th:text="${clinica.label}">Clínica</option>
					</select>
				</div>

				<div class="field context-field" data-context="VETERINARIO">
					<label for="veterinarioId">Veterinário</label>
					<select id="veterinarioId" th:field="*{veterinarioId}">
						<option value="">Selecione</option>
						<option th:each="veterinario : ${veterinarios}" th:value="${veterinario.id}" th:text="${veterinario.label}">Veterinário</option>
					</select>
				</div>

				<div class="field context-field" data-context="RESPONSAVEL">
					<label for="responsavelId">Responsável</label>
					<select id="responsavelId" th:field="*{responsavelId}">
						<option value="">Selecione</option>
						<option th:each="responsavel : ${responsaveis}" th:value="${responsavel.id}" th:text="${responsavel.label}">Responsável</option>
					</select>
				</div>

				<button class="button button-primary" type="submit">Criar usuário</button>
			</form>
		</main>
	</div>
</div>
<script>
	(() => {
		const tipo = document.querySelector("#tipo");
		const fields = [...document.querySelectorAll(".context-field")];
		const update = () => {
			fields.forEach((field) => {
				const visible = field.dataset.context === tipo.value;
				field.hidden = !visible;
				if (!visible) {
					const select = field.querySelector("select");
					if (select) select.value = "";
				}
			});
		};
		if (tipo) {
			tipo.addEventListener("change", update);
			update();
		}
	})();
</script>
</body>
</html>
