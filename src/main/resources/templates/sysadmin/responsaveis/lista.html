<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<div class="page-actions">
				<div>
					<p class="eyebrow">SysAdmin</p>
					<h2 class="page-title">Responsáveis</h2>
				</div>
				<a class="button button-primary" th:href="@{/sysadmin/responsaveis/novo}">Novo responsável</a>
			</div>

			<div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div>
			<div class="alert alert-error" th:if="${erro}" th:text="${erro}">Erro</div>

			<section class="empty-state" th:if="${responsaveis.empty}">
				<h3>Nenhum responsável cadastrado.</h3>
			</section>

			<section class="table-card" th:unless="${responsaveis.empty}">
				<table class="data-table">
					<thead>
					<tr>
						<th>Nome</th>
						<th>CPF/RG</th>
						<th>E-mail</th>
						<th>Contato</th>
						<th>Tipo</th>
						<th>Status</th>
						<th>Ações</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="responsavel : ${responsaveis.content}">
						<td th:text="${responsavel.nome}">Responsável</td>
						<td th:text="${responsavel.documento}">Documento</td>
						<td th:text="${responsavel.email ?: '-'}">responsavel@arkive.com</td>
						<td th:text="${responsavel.telefone ?: '-'}">Contato</td>
						<td th:text="${responsavel.tipo}">TUTOR</td>
						<td>
							<span class="status-badge status-active" th:if="${responsavel.ativo == 'S'}">Ativo</span>
							<span class="status-badge status-inactive" th:if="${responsavel.ativo == 'N'}">Inativo</span>
						</td>
						<td>
							<div class="table-actions">
								<a class="button button-secondary button-small" th:href="@{/sysadmin/responsaveis/{id}/editar(id=${responsavel.id})}">Editar</a>
								<form th:if="${responsavel.ativo == 'S'}" th:action="@{/sysadmin/responsaveis/{id}/desativar(id=${responsavel.id})}" method="post" onsubmit="return confirm('Desativar este responsável?');">
									<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
									<button class="button button-danger button-small" type="submit">Desativar</button>
								</form>
							</div>
						</td>
					</tr>
					</tbody>
				</table>
			</section>

			<nav class="pagination" th:if="${responsaveis.totalPages > 1}" aria-label="Paginação">
				<a class="button button-secondary" th:if="${responsaveis.hasPrevious()}" th:href="@{/sysadmin/responsaveis(page=${responsaveis.number - 1})}">Anterior</a>
				<span th:text="${responsaveis.number + 1} + ' de ' + ${responsaveis.totalPages}">1 de 1</span>
				<a class="button button-secondary" th:if="${responsaveis.hasNext()}" th:href="@{/sysadmin/responsaveis(page=${responsaveis.number + 1})}">Próxima</a>
			</nav>
		</main>
	</div>
</div>
</body>
</html>
