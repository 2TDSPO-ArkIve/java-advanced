<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<div class="page-actions">
				<div>
					<p class="eyebrow">Administrador da Clínica</p>
					<h2 class="page-title">Consultas</h2>
				</div>
			</div>

			<div class="alert alert-error" th:if="${erro}" th:text="${erro}">Erro</div>

			<section class="empty-state" th:if="${consultas.empty}">
				<h3>Nenhuma consulta encontrada.</h3>
			</section>

			<section class="table-card" th:unless="${consultas.empty}">
				<table class="data-table">
					<thead>
					<tr>
						<th>Data</th>
						<th>Animal</th>
						<th>Veterinário</th>
						<th>Modalidade</th>
						<th>Status</th>
						<th>Ações</th>
					</tr>
					</thead>
					<tbody>
					<tr th:each="consulta : ${consultas.content}">
						<td th:text="${#temporals.format(consulta.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
						<td th:text="${consulta.animalNome}">Animal</td>
						<td th:text="${consulta.veterinarioNome}">Veterinário</td>
						<td th:text="${consulta.modalidade}">PRESENCIAL</td>
						<td><span class="status-badge status-warning" th:text="${consulta.statusDescricao}">Agendada</span></td>
						<td>
							<a class="button button-secondary button-small" th:href="@{/admin/consultas/{id}(id=${consulta.id})}">Ver</a>
						</td>
					</tr>
					</tbody>
				</table>
			</section>

			<nav class="pagination" th:if="${consultas.totalPages > 1}" aria-label="Paginação">
				<a class="button button-secondary" th:if="${consultas.hasPrevious()}" th:href="@{/admin/consultas(page=${consultas.number - 1})}">Anterior</a>
				<span th:text="${consultas.number + 1} + ' de ' + ${consultas.totalPages}">1 de 1</span>
				<a class="button button-secondary" th:if="${consultas.hasNext()}" th:href="@{/admin/consultas(page=${consultas.number + 1})}">Próxima</a>
			</nav>
		</main>
	</div>
</div>
</body>
</html>
