<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<div class="app-shell">
	<aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
	<div class="app-content">
		<header th:replace="~{fragments/header :: header(${pageTitle})}"></header>
		<main class="main-content">
			<section class="intro">
				<p class="eyebrow">Administrador da Clínica</p>
				<h2 class="page-title" th:text="${sectionTitle}">Administração da Clínica</h2>
			</section>

			<section class="card-grid" aria-label="Acessos da clínica">
				<article class="info-card" th:each="item : ${quickAccess}">
					<p class="kpi-label" th:text="${item.label}">Animais</p>
					<h3 th:text="${item.label}">Animais</h3>
					<strong th:if="${item.count != null}" th:text="${item.count}">0</strong>
					<p th:text="${item.description}">Resumo</p>
					<a class="button button-secondary button-small" th:href="@{${item.href}}">Acessar</a>
				</article>
			</section>
		</main>
	</div>
</div>
</body>
</html>
