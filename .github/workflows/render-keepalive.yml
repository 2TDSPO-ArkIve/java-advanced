name: Keep ArkIve Java Warm

on:
  schedule:
    # Monday-Friday, every 10 minutes from 08:03 through 21:53
    # using São Paulo local time.
    - cron: '3,13,23,33,43,53 8-21 * * 1-5'
      timezone: 'America/Sao_Paulo'

  # Allows manual testing from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkive-render-java-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Ping ArkIve health endpoint
        shell: bash
        run: |
          echo "Waking/checking ArkIve Java API..."

          URL="https://arkive-b7v2.onrender.com/api/health"

          for attempt in {1..12}; do
            echo "Attempt $attempt/12..."

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --output /tmp/arkive-health.txt \
              --write-out "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              "$URL" || true)

            if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
              echo "Response:"
              cat /tmp/arkive-health.txt
              echo
              echo "ArkIve Java API is reachable."
              exit 0
            fi

            echo "Service not ready yet. HTTP status: $HTTP_CODE"

            if [ -f /tmp/arkive-health.txt ]; then
              cat /tmp/arkive-health.txt || true
              echo
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Waiting 15 seconds before retry..."
              sleep 15
            fi
          done

          echo "ArkIve Java API did not become healthy in time."
          exit 1