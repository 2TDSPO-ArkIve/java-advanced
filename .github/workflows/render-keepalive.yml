name: Keep ArkIve Java Warm

on:
  schedule:
    # Monday-Friday, every 10 minutes from 08:00 through 21:59
    # using São Paulo local time.
    #
    # We intentionally start at minute 3 instead of minute 0 because
    # GitHub notes that scheduled workflows can be delayed at the start
    # of each hour.
    - cron: '3,13,23,33,43,53 8-21 * * 1-5'
      timezone: 'America/Sao_Paulo'

  # Lets us test it manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arkive-render-java-keepalive
  cancel-in-progress: true

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping ArkIve health endpoint
        shell: bash
        run: |
          echo "Pinging ArkIve Java API..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            https://arkive-b7v2.onrender.com/api/health)

          echo "Response: $RESPONSE"
          echo "ArkIve Java API is reachable."